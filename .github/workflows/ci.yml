name: ci

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      browser-run:
        description: CI run ID containing the candidate browser-fixture artifact
        required: true
        type: string
      file:
        description: Device spec filename
        default: turn-reminders.spec.ts
        type: string
      project:
        type: choice
        default: phone-webkit
        options: [desktop-chromium, phone-chromium, phone-webkit, tablet-webkit, all]
      grep:
        description: Optional test-title regular expression
        type: string
      capture:
        description: Capture candidate visual references for explicit review (does not update Git)
        type: boolean
        default: false
      repeat:
        description: Repeat count (1-30)
        default: '3'
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Clean jobs have no prior edit cycle to reuse; local development stays incremental.
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    if: inputs.browser-run == ''
    name: validation selection
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      web: ${{ steps.select.outputs.web }}
      source: ${{ steps.select.outputs.source }}
      release: ${{ steps.select.outputs.release }}
      research: ${{ steps.select.outputs.research }}
      skill: ${{ steps.select.outputs.skill }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Select validation surfaces
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source-ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" == pull_request && -z "$SOURCE_REF" ]]; then
            scripts/verify-changed.sh --range "$BASE_SHA...$HEAD_SHA" --list > selected-checks
          else
            scripts/verify-changed.sh --all --list > selected-checks
          fi
          cat selected-checks >> "$GITHUB_OUTPUT"
          cat selected-checks >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validation routing regression tests
        run: |
          sh scripts/git-hooks/test-common.sh
          node --test scripts/browser-fixture.test.mjs scripts/validation/ci-results.test.mjs

  skill:
    name: bundled skill
    needs: changes
    if: needs.changes.outputs.skill == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/validation/skill.test.ts
      - run: node scripts/validation/skill.ts

  web-bundle:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    name: frontend checks and bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - run: npm --prefix web/atlas-ui ci
      - run: npm --prefix web/atlas-ui run check
      - run: npm --prefix web/atlas-ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web/atlas-ui/dist/
          retention-days: 1

  rust:
    needs: [changes, web-bundle]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-verification
          cache-workspace-crates: false
      - uses: actions/download-artifact@v7
        with:
          name: web-bundle
          path: web/atlas-ui/dist
      - name: Rust verification
        run: scripts/verify.sh

  browser-fixture:
    needs: [changes, web-bundle]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    name: build browser candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-verification
          cache-workspace-crates: false
          save-if: 'false'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: web-bundle
          path: web/atlas-ui/dist
      - name: Compile and authenticate browser candidate
        run: |
          cargo build --locked -p atlas-web --example browser_fixture
          strip --strip-debug target/debug/examples/browser_fixture
          node scripts/browser-fixture.mjs scratch/browser-artifact
          cat scratch/browser-artifact/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-fixture
          path: scratch/browser-artifact/
          retention-days: 3

  browsers:
    needs: browser-fixture
    name: device browsers (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ATLAS_BROWSER_ARTIFACT: ${{ github.workspace }}/scratch/browser-artifact
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - run: npm --prefix web/atlas-ui ci
      - uses: actions/download-artifact@v7
        with:
          name: browser-fixture
          path: scratch/browser-artifact
      - run: chmod +x "$ATLAS_BROWSER_ARTIFACT/browser_fixture"
      - name: Install device browsers
        run: npm --prefix web/atlas-ui exec -- playwright install --with-deps chromium webkit
      - name: Responsive browser acceptance
        timeout-minutes: 10
        working-directory: web/atlas-ui
        run: npm exec -- playwright test --config playwright.devices.config.ts --shard=${{ matrix.shard }}/2
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-browsers-${{ matrix.shard }}
          path: scratch/responsive-validation/browser/
          retention-days: 3

  browser-debug:
    if: inputs.browser-run != ''
    name: focused Linux browser diagnosis
    runs-on: ubuntu-24.04
    steps:
      - name: Select artifact directory outside the checkout
        run: echo "ATLAS_BROWSER_ARTIFACT=$RUNNER_TEMP/browser-artifact" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: browser-fixture
          path: ${{ env.ATLAS_BROWSER_ARTIFACT }}
          run-id: ${{ inputs.browser-run }}
          github-token: ${{ github.token }}
      - name: Select the artifact's source commit
        id: candidate
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(`${process.env.ATLAS_BROWSER_ARTIFACT}/manifest.json`));
          if (!/^[a-f0-9]{40}$/.test(manifest.commit)) throw new Error('Invalid artifact commit');
          console.log(`commit=${manifest.commit}`);
          JS
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.candidate.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - run: npm --prefix web/atlas-ui ci
      - run: chmod +x "$ATLAS_BROWSER_ARTIFACT/browser_fixture"
      - run: npm --prefix web/atlas-ui exec -- playwright install --with-deps chromium webkit
      - name: Repeat the focused case
        working-directory: web/atlas-ui
        env:
          SPEC: ${{ inputs.file }}
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
          CAPTURE: ${{ inputs.capture }}
        run: |
          [[ "$SPEC" =~ ^[a-z][a-z0-9-]*\.spec\.ts$ && -f "e2e/devices/$SPEC" ]]
          [[ "$REPEAT" =~ ^([1-9]|[12][0-9]|30)$ ]]
          project_args=()
          if [[ "$PROJECT" != all ]]; then project_args+=(--project="$PROJECT"); fi
          snapshot_args=()
          if [[ "$CAPTURE" == true ]]; then snapshot_args+=(--update-snapshots=all); fi
          npm exec -- playwright test --config playwright.devices.config.ts "${snapshot_args[@]}" "$SPEC" "${project_args[@]}" --grep="$GREP" --repeat-each="$REPEAT"
      - name: Focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-browser-evidence
          path: |
            scratch/responsive-validation/browser/
            web/atlas-ui/e2e/devices/visual/linux/
            ${{ env.ATLAS_BROWSER_ARTIFACT }}/manifest.json
          retention-days: 3

  windows-artifact:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Windows artifact publication
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify artifact coherence and publication
        run: cargo test -p atlas-index --lib --locked foundation_tests

  atlas-dev:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: atlas dev (no web bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test standalone Rust diagnostics
        run: |
          test ! -d web/atlas-ui/dist
          cargo build -p atlas-dev --locked
          cargo test -p atlas-dev -p atlas-cli-support --locked

  web-ui:
    needs: [changes, web-bundle]
    if: needs.changes.outputs.web == 'true'
    name: web ui
    runs-on: ubuntu-24.04
    env:
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - name: Web UI verification
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run test

  source-contracts:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: source contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-tools/source-contracts/package-lock.json
      - name: Prepare repository Rust formatter
        # Node test files run concurrently; resolve/install the repo-pinned
        # toolchain before their rustfmt subprocesses can race rustup.
        run: rustfmt --version
      - name: Source contract fixture tests
        run: |
          npm --prefix dev-tools/source-contracts ci --ignore-scripts
          cargo fetch --locked
          npm --prefix dev-tools/source-contracts run verify
      - name: Verify Rust portfolio from the pinned Foundry source
        run: npm --prefix dev-tools/source-contracts run verify-generated

  release-tools:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    name: release tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Install release tool dependencies
        run: npm --prefix dev-tools/release ci --ignore-scripts
      - name: Verify private release tools on Windows
        if: runner.os == 'Windows'
        # Archive fixtures also need Git Bash's XZ-capable tar.
        shell: bash
        run: npm --prefix dev-tools/release run verify
      - name: Unix installer and preparation smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/release/validate-release-tooling.sh
          scripts/release/test-release-tools.sh
          scripts/release/test-prepare-release.sh
      - name: Windows installer smoke tests
        if: runner.os == 'Windows'
        # Git Bash supplies XZ-capable tar; Windows' bundled tar cannot create XZ.
        shell: bash
        run: pwsh -NoProfile -File scripts/release/test-installer.ps1

  research:
    name: research evidence
    needs: changes
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sh scripts/validation/research.sh

  validation:
    name: validation complete
    if: always() && inputs.browser-run == ''
    needs: [changes, web-bundle, browser-fixture, browsers, rust, windows-artifact, atlas-dev, web-ui, source-contracts, release-tools, research, skill]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/validation/ci-results.mjs
