name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - name: Build web UI bundle
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run build
      - name: Rust verification
        run: scripts/verify.sh

  atlas-dev:
    name: atlas dev (no web bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test standalone Rust diagnostics
        run: |
          test ! -d web/atlas-ui/dist
          cargo build -p atlas-dev --locked
          cargo test -p atlas-dev -p atlas-cli-support --locked

  web-ui:
    name: web ui
    runs-on: ubuntu-24.04
    env:
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - name: Web UI verification
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run verify

  source-contracts:
    name: source contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/source-contracts/package-lock.json
      - name: Prepare repository Rust formatter
        # Node test files run concurrently; resolve/install the repo-pinned
        # toolchain before their rustfmt subprocesses can race rustup.
        run: rustfmt --version
      - name: Source contract fixture tests
        run: |
          npm --prefix scripts/source-contracts ci --ignore-scripts
          npm --prefix scripts/source-contracts run verify

  release-tools:
    name: release tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json
      - name: Verify private release tools
        shell: bash
        run: |
          npm --prefix scripts/release ci --ignore-scripts
          npm --prefix scripts/release run verify
      - name: Unix installer and preparation smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/release/validate-release-tooling.sh
          scripts/release/test-release-tools.sh
          scripts/release/test-prepare-release.sh
      - name: Windows installer smoke tests
        if: runner.os == 'Windows'
        # Git Bash supplies XZ-capable tar; Windows' bundled tar cannot create XZ.
        shell: bash
        run: pwsh -NoProfile -File scripts/release/test-installer.ps1
