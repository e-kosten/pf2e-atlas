name: ci

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Clean jobs have no prior edit cycle to reuse; local development stays incremental.
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    name: validation selection
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      windows: ${{ steps.select.outputs.windows }}
      audit: ${{ steps.select.outputs.audit }}
      web: ${{ steps.select.outputs.web }}
      web-format: ${{ steps.select.outputs.web-format }}
      source: ${{ steps.select.outputs.source }}
      release: ${{ steps.select.outputs.release }}
      research: ${{ steps.select.outputs.research }}
      skill: ${{ steps.select.outputs.skill }}
      browser: ${{ steps.select.outputs.browser }}
      dev: ${{ steps.select.outputs.dev }}
      tooling: ${{ steps.select.outputs.tooling }}
      embedding: ${{ steps.select.outputs.embedding }}
      embedding-runners: ${{ steps.select.outputs.embedding-runners }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Select validation surfaces
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source-ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" == pull_request && -z "$SOURCE_REF" ]]; then
            scripts/verify-changed.sh --range "$BASE_SHA...$HEAD_SHA" --list > selected-checks
          else
            scripts/verify-changed.sh --all --list > selected-checks
          fi
          embedding_args=(--select --base "$BASE_SHA")
          if [[ "$EVENT" == workflow_dispatch ]]; then
            embedding_args+=(--manual)
          fi
          embedding_runners="$(python3 scripts/validation/embedding-stack.py "${embedding_args[@]}")"
          echo "embedding-runners=$embedding_runners" >> "$GITHUB_OUTPUT"
          if [[ "$embedding_runners" == '[]' ]]; then
            echo "embedding=false" >> selected-checks
          else
            echo "embedding=true" >> selected-checks
          fi
          windows=false
          if grep -q '^rust=true$' selected-checks; then
            windows="$(python3 scripts/validation/windows-selection.py --base "$BASE_SHA")"
          fi
          echo "windows=$windows" >> selected-checks
          cat selected-checks >> "$GITHUB_OUTPUT"
          cat selected-checks >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check reviewed embedding dependencies
        run: python3 scripts/validation/embedding-stack.py
      - name: Validation routing regression tests
        run: node scripts/validation/tooling.mjs

  embedding:
    name: embedding compatibility (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.embedding == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.embedding-runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-workspace-crates: false
      - uses: actions/cache@v4
        with:
          path: target/embedding-models
          key: embedding-models-v1-${{ hashFiles('crates/atlas-embedding/src/catalog.rs', 'crates/atlas-embedding/src/model_cache.rs') }}
      - name: Build candidate and verify pinned models
        run: |
          cargo build --locked -p atlas-cli --no-default-features
          cargo build --locked -p atlas-runtime --example migrate-fixture-workspace
          cargo run --locked -p atlas-embedding --example prepare-model-cache -- target/embedding-models
      - name: Check native token IDs
        shell: bash
        run: |
          ATLAS_TEST_MODEL_CACHE="$(python -c 'from pathlib import Path; print(Path("target/embedding-models").resolve().as_posix())')"
          export ATLAS_TEST_MODEL_CACHE
          # Each test loads full model sessions; bound peak memory on release runners.
          cargo test --locked -p atlas-embedding compatibility_tests -- --ignored --test-threads=1
      - name: Check search against release fixtures
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate=target/debug/atlas
          migrator=target/debug/examples/migrate-fixture-workspace
          if [[ "$RUNNER_OS" == Windows ]]; then
            candidate+=.exe
            migrator+=.exe
          fi
          python scripts/validation/probe-embedding-upgrade.py --pins \
            --base-ref "$BASE_SHA" --repository "$GITHUB_REPOSITORY" \
            --workspace-migrator "$migrator" \
            --candidate "$candidate" --model-cache target/embedding-models \
            --output "$RUNNER_TEMP/embedding-compatibility"
      - name: Summarize results
        if: ${{ always() }}
        shell: bash
        run: |
          for report in "$RUNNER_TEMP"/embedding-compatibility/bundle-*/result.json; do
            if [[ -f "$report" ]]; then
              { echo '~~~json'; cat "$report"; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: embedding-compatibility-${{ matrix.os }}
          path: ${{ runner.temp }}/embedding-compatibility/bundle-*/*.json

  advisories:
    name: advisories
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Scan Cargo and npm lockfiles
        run: python3 scripts/validation/dependency-audit.py

  skill:
    name: bundled skill
    needs: changes
    if: needs.changes.outputs.skill == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test scripts/validation/skill.test.ts
      - run: node scripts/validation/skill.ts

  web-bundle:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.browser == 'true'
    name: frontend checks and bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - run: npm --prefix web/atlas-ui ci
      - name: Frontend checks and bundle
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.web-format == 'true'
        run: npm --prefix web/atlas-ui run verify:bundle
      - name: Bundle and typecheck for Rust-only changes
        if: needs.changes.outputs.web != 'true' && needs.changes.outputs.web-format != 'true'
        run: npm --prefix web/atlas-ui run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          overwrite: true
          path: web/atlas-ui/dist/
          retention-days: 1

  rust:
    needs: [changes, web-bundle]
    if: needs.changes.outputs.rust == 'true'
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-verification
          cache-workspace-crates: false
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: web/atlas-ui/dist
      - name: Install nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest@0.9.150
      - name: Rust verification
        run: scripts/verify.sh
      - name: Validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-validation-attempt-${{ github.run_attempt }}
          path: .atlas/validation/
          include-hidden-files: true
          retention-days: 3

  browser-fixture:
    needs: [changes, web-bundle]
    if: needs.changes.outputs.browser == 'true'
    name: build browser candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-verification
          cache-workspace-crates: false
          save-if: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: web/atlas-ui/dist
      - name: Compile and authenticate browser candidate
        run: |
          node scripts/browser-fixture.mjs scratch/browser-artifact
          cat scratch/browser-artifact/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: browser-fixture
          overwrite: true
          path: scratch/browser-artifact/
          retention-days: 3

  browsers:
    needs: browser-fixture
    name: device browsers (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ATLAS_BROWSER_ARTIFACT: ${{ github.workspace }}/scratch/browser-artifact
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - run: npm --prefix web/atlas-ui ci
      - uses: actions/download-artifact@v8
        with:
          name: browser-fixture
          path: scratch/browser-artifact
      - run: chmod +x "$ATLAS_BROWSER_ARTIFACT/browser_fixture"
      - name: Use Ubuntu HTTPS archive
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install device browsers
        timeout-minutes: 3
        run: npm --prefix web/atlas-ui exec -- playwright install --with-deps chromium webkit
      - name: Responsive browser acceptance
        timeout-minutes: 25
        working-directory: web/atlas-ui
        run: npm exec -- playwright test --config playwright.devices.config.ts --shard=${{ matrix.shard }}/2
      - name: Browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: device-browsers-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: scratch/responsive-validation/browser/
          retention-days: 3

  windows-artifact:
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.tooling == 'true'
    name: Windows artifact publication
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.windows == 'true'
      - name: Verify bounded storage sessions and file release
        if: needs.changes.outputs.windows == 'true'
        run: cargo test -p atlas-storage --locked
      - name: Verify artifact coherence and publication
        if: needs.changes.outputs.windows == 'true'
        run: cargo test -p atlas-index --lib --locked foundation_tests
      - name: Verify atomic publication and vector repacking after process crashes
        if: needs.changes.outputs.windows == 'true'
        run: cargo test -p atlas-index --lib --locked publication_crash_tests

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.tooling == 'true'
        with:
          node-version: 26
      - name: Native Windows validation cancellation
        if: needs.changes.outputs.tooling == 'true'
        shell: bash
        run: node --test scripts/validation/native-cancellation.test.mjs

  atlas-dev:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.dev == 'true'
    name: atlas dev (no web bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test standalone Rust diagnostics
        run: |
          test ! -d web/atlas-ui/dist
          cargo build -p atlas-dev --locked
          cargo test -p atlas-dev -p atlas-cli-support --locked
      - name: Developer-only formatting and lint
        if: needs.changes.outputs.rust != 'true'
        run: |
          cargo fmt --check
          cargo clippy -p atlas-dev -p atlas-cli-support --all-targets --locked -- -D warnings -D clippy::dbg_macro
          cargo clippy -p atlas-dev -p atlas-cli-support --lib --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unimplemented -D clippy::todo -D clippy::unreachable

  web-ui:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web ui
    runs-on: ubuntu-24.04
    env:
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - name: Web UI verification
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run test

  source-contracts:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: source contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dev-tools/source-contracts/package-lock.json
      - name: Prepare repository Rust formatter
        # Node test files run concurrently; resolve/install the repo-pinned
        # toolchain before their rustfmt subprocesses can race rustup.
        run: rustfmt --version
      - name: Source contract fixture tests
        run: |
          npm --prefix dev-tools/source-contracts ci --ignore-scripts
          cargo fetch --locked
          npm --prefix dev-tools/source-contracts run verify
      - name: Verify Rust portfolio from the pinned Foundry source
        run: npm --prefix dev-tools/source-contracts run verify-generated

  release-tools:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    name: release tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Install release tool dependencies
        run: npm --prefix dev-tools/release ci --ignore-scripts
      - name: Verify private release tools on Windows
        if: runner.os == 'Windows'
        # Archive fixtures also need Git Bash's XZ-capable tar.
        shell: bash
        run: npm --prefix dev-tools/release run verify
      - name: Unix installer and preparation smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/release/validate-release-tooling.sh
          scripts/release/test-release-tools.sh
          scripts/release/test-prepare-release.sh
      - name: Windows installer smoke tests
        if: runner.os == 'Windows'
        # Git Bash supplies XZ-capable tar; Windows' bundled tar cannot create XZ.
        shell: bash
        run: pwsh -NoProfile -File scripts/release/test-installer.ps1

  research:
    name: research evidence
    needs: changes
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: sh scripts/validation/research.sh

  validation:
    name: validation complete
    if: ${{ !cancelled() }}
    needs: [changes, web-bundle, browser-fixture, browsers, rust, windows-artifact, atlas-dev, web-ui, source-contracts, release-tools, research, skill, embedding, advisories]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Require selected jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/validation/ci-results.mjs
