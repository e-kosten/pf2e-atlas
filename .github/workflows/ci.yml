name: ci

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Clean jobs have no prior edit cycle to reuse; local development stays incremental.
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    name: validation selection
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      web: ${{ steps.select.outputs.web }}
      source: ${{ steps.select.outputs.source }}
      release: ${{ steps.select.outputs.release }}
      research: ${{ steps.select.outputs.research }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Select validation surfaces
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source-ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" == pull_request && -z "$SOURCE_REF" ]]; then
            scripts/verify-changed.sh --range "$BASE_SHA...$HEAD_SHA" --list > selected-checks
          else
            scripts/verify-changed.sh --all --list > selected-checks
          fi
          cat selected-checks >> "$GITHUB_OUTPUT"
          cat selected-checks >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validation routing regression tests
        run: sh scripts/git-hooks/test-common.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - name: Build web UI bundle
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run build
      - name: Rust verification
        run: scripts/verify.sh
      # Reuse this job's Cargo target and frontend installation for real-app
      # browser acceptance; no second Rust build tree, source clone or models.
      - name: Install device browsers
        run: npm --prefix web/atlas-ui exec -- playwright install --with-deps chromium webkit
      - name: Responsive browser acceptance
        id: browser-tests
        timeout-minutes: 10
        working-directory: web/atlas-ui
        run: npm exec -- playwright test --config playwright.devices.config.ts
      - name: Browser failure evidence
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-failure
          path: scratch/responsive-validation/browser/
          retention-days: 3

  windows-artifact:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Windows artifact publication
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify artifact coherence and publication
        run: cargo test -p atlas-index --lib --locked foundation_tests

  atlas-dev:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: atlas dev (no web bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test standalone Rust diagnostics
        run: |
          test ! -d web/atlas-ui/dist
          cargo build -p atlas-dev --locked
          cargo test -p atlas-dev -p atlas-cli-support --locked

  web-ui:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web ui
    runs-on: ubuntu-24.04
    env:
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/atlas-ui/package-lock.json
      - name: Web UI verification
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run verify

  source-contracts:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: source contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-tools/source-contracts/package-lock.json
      - name: Prepare repository Rust formatter
        # Node test files run concurrently; resolve/install the repo-pinned
        # toolchain before their rustfmt subprocesses can race rustup.
        run: rustfmt --version
      - name: Source contract fixture tests
        run: |
          npm --prefix dev-tools/source-contracts ci --ignore-scripts
          cargo fetch --locked
          npm --prefix dev-tools/source-contracts run verify
      - name: Verify Rust portfolio from the pinned Foundry source
        run: npm --prefix dev-tools/source-contracts run verify-generated

  release-tools:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    name: release tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Install release tool dependencies
        run: npm --prefix dev-tools/release ci --ignore-scripts
      - name: Verify private release tools on Windows
        if: runner.os == 'Windows'
        # Archive fixtures also need Git Bash's XZ-capable tar.
        shell: bash
        run: npm --prefix dev-tools/release run verify
      - name: Unix installer and preparation smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/release/validate-release-tooling.sh
          scripts/release/test-release-tools.sh
          scripts/release/test-prepare-release.sh
      - name: Windows installer smoke tests
        if: runner.os == 'Windows'
        # Git Bash supplies XZ-capable tar; Windows' bundled tar cannot create XZ.
        shell: bash
        run: pwsh -NoProfile -File scripts/release/test-installer.ps1

  research:
    name: research evidence
    needs: changes
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sh scripts/validation/research.sh

  validation:
    name: validation complete
    if: always()
    needs: [changes, rust, windows-artifact, atlas-dev, web-ui, source-contracts, release-tools, research]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const jobs = JSON.parse(process.env.NEEDS_JSON);
          assert.equal(jobs.changes.result, 'success', 'Validation selection must succeed');
          const flags = jobs.changes.outputs;
          for (const key of ["rust", "web", "source", "release", "research"]) {
            assert(["true", "false"].includes(flags[key]), key);
          }
          const expected = {
            rust: flags.rust === 'true' || flags.web === 'true',
            'windows-artifact': flags.rust === 'true',
            'atlas-dev': flags.rust === 'true',
            'web-ui': flags.web === 'true',
            'source-contracts': flags.source === 'true',
            'release-tools': flags.release === 'true',
            research: flags.research === 'true',
          };
          for (const [job, required] of Object.entries(expected)) {
            assert.equal(jobs[job].result, required ? 'success' : 'skipped', job);
          }
          JS
