name: dependency audit

on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Scan Cargo and npm lockfiles
        run: python3 scripts/validation/dependency-audit.py
