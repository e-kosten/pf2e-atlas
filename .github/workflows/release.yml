name: release

on:
  push:
    tags:
      - "v*"
      - "!v*-nightly.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DIST_VERSION: "0.31.0"

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Build private release tools
        shell: bash
        run: |
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix dev-tools/release run build
      - name: Release tool smoke tests
        shell: bash
        run: |
          scripts/release/validate-release-tooling.sh
          scripts/release/test-release-tools.sh
          scripts/release/test-prepare-release.sh
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' crates/atlas-cli/Cargo.toml)"
          if [[ "$crate_version" != "$version" ]]; then
            echo "crate version $crate_version does not match tag $tag" >&2
            exit 1
          fi
          notes="docs/releases/$tag.md"
          if [[ ! -s "$notes" ]]; then
            echo "missing release notes: $notes" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: cargo-dist ${{ matrix.target }} (${{ matrix.variant }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            variant: full
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            variant: full
          - target: aarch64-apple-darwin
            os: macos-26
            variant: full
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            variant: full
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            variant: cli-only
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            variant: cli-only
          - target: aarch64-apple-darwin
            os: macos-26
            variant: cli-only
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            variant: cli-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dev-tools/release/package-lock.json
            web/atlas-ui/package-lock.json
      - name: Build private release tools
        shell: bash
        run: |
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix dev-tools/release run build
      - name: Install cargo-dist
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install cargo-dist on Windows
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/v$env:DIST_VERSION/cargo-dist-installer.ps1" | iex
      - name: Build web UI bundle
        if: ${{ matrix.variant == 'full' }}
        shell: bash
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run build
      - name: Select CLI-only build
        if: ${{ matrix.variant == 'cli-only' }}
        shell: bash
        run: printf '\ndefault-features = false\n' >> dist-workspace.toml
      - name: Generate notices
        shell: bash
        run: node dev-tools/release/dist/src/cli/generate-notices.js
      - name: Validate PowerShell installer
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        # Git Bash supplies XZ-capable tar for the installer archive fixtures.
        shell: bash
        run: |
          pwsh -NoProfile -File scripts/install/atlas-installer.ps1 -DryRun
          pwsh -NoProfile -File scripts/release/test-installer.ps1
      - name: Build archives with cargo-dist
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          mkdir -p target
          dist build --allow-dirty --no-local-paths --output-format json --artifacts local --target "${{ matrix.target }}" --tag "${{ needs.validate-tag.outputs.tag }}" > target/package-dist-manifest.json
      - name: Build archives with cargo-dist on Windows
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=-crt-static -C link-arg=/NODEFAULTLIB:libcmt -C link-arg=msvcprt.lib -C link-arg=legacy_stdio_definitions.lib"
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          dist build --allow-dirty --no-local-paths --output-format json --artifacts local --target "${{ matrix.target }}" --tag "${{ needs.validate-tag.outputs.tag }}" > target/package-dist-manifest.json
      - name: Stage CLI-only artifacts
        if: ${{ matrix.variant == 'cli-only' }}
        shell: bash
        run: node dev-tools/release/dist/src/cli/stage-cli-only.js "${{ matrix.target }}" target/distrib target/package-dist-manifest.json
      - name: Check packaged binary on Unix
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p target/package-smoke
          prefix=atlas-cli
          if [[ "$VARIANT" == cli-only ]]; then prefix=atlas-cli-only; fi
          tar -xJf "target/distrib/$prefix-${{ matrix.target }}.tar.xz" -C target/package-smoke
          binary=$(find target/package-smoke -type f -name atlas -print -quit)
          test -n "$binary"
          node dev-tools/release/dist/src/cli/smoke-packaged-cli.js "$binary" "$EXPECTED_VERSION" "$VARIANT"
          if [[ "$VARIANT" == full ]]; then
            node dev-tools/release/dist/src/cli/smoke-packaged-web.js "$binary" web/atlas-ui/dist
          fi
      - name: Check packaged binary on Windows
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          $prefix = if ($env:VARIANT -eq "full") { "atlas-cli" } else { "atlas-cli-only" }
          Expand-Archive "target/distrib/$prefix-${{ matrix.target }}.zip" target/package-smoke
          $binary = Get-ChildItem target/package-smoke -Filter atlas.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw "packaged atlas.exe is missing" }
          node dev-tools/release/dist/src/cli/smoke-packaged-cli.js $binary.FullName $env:EXPECTED_VERSION $env:VARIANT
          if ($LASTEXITCODE -ne 0) { throw "packaged CLI smoke test failed" }
          if ($env:VARIANT -eq "full") {
            node dev-tools/release/dist/src/cli/smoke-packaged-web.js $binary.FullName web/atlas-ui/dist
            if ($LASTEXITCODE -ne 0) { throw "packaged web smoke test failed" }
          }
      - name: Upload cargo-dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.target }}-${{ matrix.variant }}
          path: |
            target/distrib/atlas-cli*-${{ matrix.target }}.*
            target/distrib/cli-only-${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    name: upload and publish release
    needs: [validate-tag, build]
    if: ${{ always() && needs.validate-tag.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.validate-tag.outputs.tag }}
      PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Build private release tools
        shell: bash
        run: |
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix dev-tools/release run build
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: target/distrib
          merge-multiple: true
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Add installers and notices
        shell: bash
        run: |
          set -euo pipefail
          node dev-tools/release/dist/src/cli/generate-notices.js
          cp scripts/install/atlas-installer.sh target/distrib/atlas-installer.sh
          cp scripts/install/atlas-installer.ps1 target/distrib/atlas-installer.ps1
          cp THIRD-PARTY-NOTICES.md target/distrib/THIRD-PARTY-NOTICES.md
      - name: Generate cargo-dist manifest
        shell: bash
        run: |
          dist manifest --artifacts local --tag "$TAG" --allow-dirty --no-local-paths --output-format json > dist-manifest.json
          node dev-tools/release/dist/src/cli/prune-dist-manifest.js dist-manifest.json target/distrib
          mv dist-manifest.json target/distrib/dist-manifest.json
      - name: Generate manifest and checksums
        shell: bash
        run: node dev-tools/release/dist/src/cli/generate-release-manifest.js "$TAG" target/distrib
      - name: Validate required assets
        shell: bash
        run: node dev-tools/release/dist/src/cli/validate-release-assets.js "$TAG" target/distrib
      - name: Wait for draft release
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "release $TAG was not created by the release helper" >&2
          exit 1
      - name: Upload assets to draft release
        shell: bash
        run: gh release upload "$TAG" target/distrib/* --clobber
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest=true
          fi
