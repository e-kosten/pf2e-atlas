name: release

on:
  push:
    tags:
      - "release/v*"
      - "rc/v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package-tag: ${{ steps.version.outputs.package-tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ && ! "$tag" =~ ^rc/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          package_tag="${tag#*/}"
          ref="refs/tags/$tag"
          git fetch --depth=1 --no-tags origin "$ref"
          object=$(git rev-parse FETCH_HEAD)
          node scripts/release/prep-state.mjs remote-notes "$tag" "$(git rev-parse HEAD)" "$object"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package-tag=$package_tag" >> "$GITHUB_OUTPUT"

  package:
    needs: validate-tag
    uses: ./.github/workflows/release-build-check.yml
    secrets:
      atlas-updater-private-key: ${{ secrets.ATLAS_UPDATER_PRIVATE_KEY }}
      atlas-updater-password: ${{ secrets.ATLAS_UPDATER_PASSWORD }}
    with:
      production-updater: true
      tag: ${{ needs.validate-tag.outputs.package-tag }}
      source-ref: ${{ github.sha }}

  publish:
    name: upload and publish release
    needs: [validate-tag, package]
    if: ${{ always() && needs.validate-tag.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Build private release tools
        shell: bash
        run: |
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix dev-tools/release run build
      - name: Download assembled release assets
        uses: actions/download-artifact@v8
        with:
          name: release-build-check-${{ needs.validate-tag.outputs.package-tag }}
          path: target/distrib
      - name: Wait for draft release
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "release $TAG was not created by the release helper" >&2
          exit 1
      - name: Verify, upload and publish release
        shell: bash
        run: node dev-tools/release/dist/src/cli/publish-official.js "$TAG" "$(git rev-parse HEAD)" target/distrib
