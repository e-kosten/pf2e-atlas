name: Windows desktop

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install frontend and bundle tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix web/atlas-ui ci
          npm --prefix desktop ci
          npm --prefix dev-tools/release ci --ignore-scripts
      - name: Build installer and test the bundled CLI
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --test desktop/bootstrap.test.mjs desktop/release-config.test.mjs
          ./desktop/bundle-windows.ps1
          cargo test --locked --release --target x86_64-pc-windows-msvc -p atlas-cli --test desktop
      - name: Test the native host
        env:
          CARGO_ENCODED_RUSTFLAGS: -Ctarget-feature=+crt-static
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --target-dir target --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check clean install, sidecar and protocol registration
        run: |
          $output = 'target/x86_64-pc-windows-msvc/release'
          $installer = @(Get-ChildItem "$output/bundle/nsis" -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./desktop/verify-windows-installer.ps1 -Installer $installer[0].FullName -ExpectedCli "$output/atlas.exe" -ScratchDirectory $env:RUNNER_TEMP
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
