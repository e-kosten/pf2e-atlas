name: Windows desktop

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
  workflow_dispatch:
    inputs:
      pr-profile:
        description: Build with the PR optimization level
        type: boolean
        default: false
      cold:
        description: Bypass the Cargo cache for an uncached timing
        type: boolean
        default: false
      qualify-updater:
        description: Rehearse signed NSIS replacement and startup races with disposable data
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualify-updater }}
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Prepare pinned Rust toolchain
        run: rustc --version
      - name: Use the PR optimization level
        if: github.event_name == 'pull_request' || inputs.pr-profile
        run: '"CARGO_PROFILE_RELEASE_OPT_LEVEL=1" >> $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !inputs.cold }}
        with:
          # The CLI and host use distinct CRT flags and target directories.
          shared-key: windows-desktop-${{ hashFiles('desktop/bundle-windows.ps1', '.github/workflows/windows-desktop.yml') }}
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          cache-workspace-crates: false
          cache-bin: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/atlas-ui/package-lock.json
            desktop/package-lock.json
            dev-tools/release/package-lock.json
      - name: Install frontend and bundle tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix web/atlas-ui ci
          npm --prefix desktop ci
          npm --prefix dev-tools/release ci --ignore-scripts
      - name: Build installer and test the bundled CLI
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --test desktop/bootstrap.test.mjs desktop/release-config.test.mjs
          ./desktop/bundle-windows.ps1 -HostTargetDirectory desktop/src-tauri/target -CargoTimings
          cargo test --locked --release --target x86_64-pc-windows-msvc -p atlas-cli --test desktop
      - name: Test the native host
        env:
          CARGO_ENCODED_RUSTFLAGS: -Ctarget-feature=+crt-static
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --target-dir desktop/src-tauri/target --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check clean install, sidecar and protocol registration
        run: |
          $bundle = 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          $cli = 'target/x86_64-pc-windows-msvc/release/atlas.exe'
          ./desktop/verify-windows-installer.ps1 -Installer $installer[0].FullName -ExpectedCli $cli -ScratchDirectory $env:RUNNER_TEMP
      - name: Upload Cargo build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-cargo-timings-attempt-${{ github.run_attempt }}
          path: |
            target/cargo-timings/cargo-timing-*.html
            desktop/src-tauri/target/cargo-timings/cargo-timing-*.html
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-windows-x64
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          overwrite: true
          if-no-files-found: error

  qualify-updater:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify-updater }}
    name: Disposable Windows updater qualification
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: ${{ !inputs.cold }}
        with:
          shared-key: windows-updater-qualification-${{ hashFiles('desktop/bundle-windows.ps1') }}
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          cache-on-failure: true
          cache-workspace-crates: false
          cache-bin: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/atlas-ui/package-lock.json
            desktop/package-lock.json
            dev-tools/release/package-lock.json
      - name: Prepare existing desktop tooling and CLI
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix web/atlas-ui ci
          npm --prefix desktop ci
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix web/atlas-ui run build
          cargo build --locked --release --target x86_64-pc-windows-msvc -p atlas-cli
      - name: Rehearse signed update and target-startup refusal
        id: qualification
        run: ./desktop/qualify-windows.ps1 -PackagedCli target/x86_64-pc-windows-msvc/release/atlas.exe -ScratchDirectory $env:RUNNER_TEMP
      - name: Retain qualification screenshots and admission evidence
        if: ${{ always() && steps.qualification.outputs.evidence != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-updater-qualification-${{ github.run_attempt }}
          path: |
            ${{ steps.qualification.outputs.evidence }}/events.jsonl
            ${{ steps.qualification.outputs.evidence }}/result.json
            ${{ steps.qualification.outputs.evidence }}/normal/*.png
            ${{ steps.qualification.outputs.evidence }}/normal/*.json
            ${{ steps.qualification.outputs.evidence }}/normal/failure-*.txt
            ${{ steps.qualification.outputs.evidence }}/normal/hook-error.txt
            ${{ steps.qualification.outputs.evidence }}/identity/*.png
            ${{ steps.qualification.outputs.evidence }}/identity/*.json
            ${{ steps.qualification.outputs.evidence }}/identity/failure-*.txt
            ${{ steps.qualification.outputs.evidence }}/identity/hook-error.txt
            ${{ steps.qualification.outputs.evidence }}/ledger/*.png
            ${{ steps.qualification.outputs.evidence }}/ledger/*.json
            ${{ steps.qualification.outputs.evidence }}/ledger/failure-*.txt
            ${{ steps.qualification.outputs.evidence }}/ledger/hook-error.txt
          if-no-files-found: warn
          retention-days: 3
