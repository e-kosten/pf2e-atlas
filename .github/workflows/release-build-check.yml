name: release build check

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      tools-verified:
        description: "Caller has verified release tools for this exact source in successful full CI."
        type: boolean
        default: false
      nightly:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to use for cargo-dist metadata, such as v0.1.0-rc.2. Defaults to v<atlas-cli version>."
        required: false
        type: string
  push:
    branches:
      - "release-build-check/**"
      - "release-build-check-*"

permissions:
  contents: read

concurrency:
  group: release-build-check-${{ inputs.nightly && 'nightly' || 'check' }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare build check
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      dist-artifacts: ${{ steps.dist.outputs.prefix }}
      embedding-targets: ${{ steps.embedding.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Select packaged embedding checks
        id: embedding
        shell: bash
        env:
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [[ "$NIGHTLY" == true ]]; then
            echo 'targets=[]' >> "$GITHUB_OUTPUT"
          else
            targets="$(python3 scripts/validation/embedding-stack.py --release-targets)"
            echo "targets=$targets" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Install private release tools
        shell: bash
        run: npm --prefix dev-tools/release ci --ignore-scripts
      - name: Build previously verified release tools
        if: ${{ inputs.tools-verified }}
        shell: bash
        run: npm --prefix dev-tools/release run build
      - name: Release tool smoke tests
        if: ${{ !inputs.tools-verified }}
        shell: bash
        run: |
          scripts/release/validate-release-tooling.sh
          scripts/release/test-release-tools.sh
          scripts/release/test-prepare-release.sh
      - name: Prepare nightly version
        if: ${{ inputs.nightly }}
        shell: bash
        env:
          NIGHTLY_TAG: ${{ inputs.tag }}
        run: node dev-tools/release/dist/src/cli/nightly.js prepare --tag "$NIGHTLY_TAG"
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' crates/atlas-cli/Cargo.toml)"
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v$crate_version"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release-check tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          if [[ "$crate_version" != "$version" ]]; then
            echo "crate version $crate_version does not match release-check tag $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore verified cargo-dist archives
        id: dist-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-cargo-dist-archives
          key: cargo-dist-archives-v1-${{ hashFiles('scripts/release/cargo-dist-checksums.json') }}
      - name: Acquire cargo-dist archives
        id: dist
        shell: bash
        env:
          DIST_ARCHIVES: ${{ runner.temp }}/atlas-cargo-dist-archives
        run: |
          node scripts/release/cargo-dist.mjs acquire "$DIST_ARCHIVES"
          echo "prefix=cargo-dist-tool-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Save verified cargo-dist archives
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/atlas-cargo-dist-archives
          key: ${{ steps.dist-cache.outputs.cache-primary-key }}
      - name: Share cargo-dist for x64 Linux
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist.outputs.prefix }}-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/atlas-cargo-dist-archives/cargo-dist-x86_64-unknown-linux-gnu.tar.xz
          compression-level: 0
          if-no-files-found: error
      - name: Share cargo-dist for ARM64 Linux
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist.outputs.prefix }}-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/atlas-cargo-dist-archives/cargo-dist-aarch64-unknown-linux-gnu.tar.xz
          compression-level: 0
          if-no-files-found: error
      - name: Share cargo-dist for ARM64 macOS
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist.outputs.prefix }}-aarch64-apple-darwin
          path: ${{ runner.temp }}/atlas-cargo-dist-archives/cargo-dist-aarch64-apple-darwin.tar.xz
          compression-level: 0
          if-no-files-found: error
      - name: Share cargo-dist for x64 Windows
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dist.outputs.prefix }}-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/atlas-cargo-dist-archives/cargo-dist-x86_64-pc-windows-msvc.zip
          compression-level: 0
          if-no-files-found: error

  build:
    name: cargo-dist ${{ matrix.target }} (${{ matrix.variant }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            variant: full
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            variant: full
          - target: aarch64-apple-darwin
            os: macos-26
            variant: full
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            variant: full
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            variant: cli-only
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            variant: cli-only
          - target: aarch64-apple-darwin
            os: macos-26
            variant: cli-only
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            variant: cli-only
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            dev-tools/release/package-lock.json
            web/atlas-ui/package-lock.json
      - name: Build private release tools
        shell: bash
        run: |
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix dev-tools/release run build
      - name: Prepare nightly version
        if: ${{ inputs.nightly }}
        shell: bash
        env:
          NIGHTLY_TAG: ${{ inputs.tag }}
        run: node dev-tools/release/dist/src/cli/nightly.js prepare --tag "$NIGHTLY_TAG"
      - name: Download verified cargo-dist archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.dist-artifacts }}-${{ matrix.target }}
          path: ${{ runner.temp }}/atlas-cargo-dist-archives
      - name: Install cargo-dist
        shell: bash
        env:
          DIST_ARCHIVES: ${{ runner.temp }}/atlas-cargo-dist-archives
          DIST_TARGET: ${{ matrix.target }}
        run: node scripts/release/cargo-dist.mjs install "$DIST_ARCHIVES" "$DIST_TARGET"
      - name: Build web UI bundle
        if: ${{ matrix.variant == 'full' }}
        shell: bash
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix web/atlas-ui run build
      - name: Select CLI-only build
        if: ${{ matrix.variant == 'cli-only' }}
        shell: bash
        run: printf '\ndefault-features = false\n' >> dist-workspace.toml
      - name: Generate notices
        shell: bash
        run: node dev-tools/release/dist/src/cli/generate-notices.js --output target/atlas-release/THIRD-PARTY-NOTICES.md
      - name: Validate PowerShell installer
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' && matrix.variant == 'full' && !inputs.tools-verified }}
        # Git Bash supplies XZ-capable tar for the installer archive fixtures.
        shell: bash
        run: |
          pwsh -NoProfile -File scripts/install/atlas-installer.ps1 -DryRun
          pwsh -NoProfile -File scripts/release/test-installer.ps1
      - name: Link Apple availability runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          runtime="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
          test -f "$runtime"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=$runtime" >> "$GITHUB_ENV"
      - name: Build archives with cargo-dist
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          mkdir -p target
          dist build --allow-dirty --no-local-paths --output-format json --artifacts local --target "${{ matrix.target }}" --tag "${{ needs.prepare.outputs.tag }}" > target/package-dist-manifest.json
      - name: Build archives with cargo-dist on Windows
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=-crt-static -C link-arg=/NODEFAULTLIB:libcmt -C link-arg=msvcprt.lib -C link-arg=legacy_stdio_definitions.lib"
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          dist build --allow-dirty --no-local-paths --output-format json --artifacts local --target "${{ matrix.target }}" --tag "${{ needs.prepare.outputs.tag }}" > target/package-dist-manifest.json
      - name: Stage CLI-only artifacts
        if: ${{ matrix.variant == 'cli-only' }}
        shell: bash
        run: node dev-tools/release/dist/src/cli/stage-cli-only.js "${{ matrix.target }}" target/distrib target/package-dist-manifest.json
      - name: Check packaged binary on Unix
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p target/package-smoke
          prefix=atlas-cli
          if [[ "$VARIANT" == cli-only ]]; then prefix=atlas-cli-only; fi
          tar -xJf "target/distrib/$prefix-${{ matrix.target }}.tar.xz" -C target/package-smoke
          binary=$(find target/package-smoke -type f -name atlas -print -quit)
          test -n "$binary"
          node dev-tools/release/dist/src/cli/smoke-packaged-cli.js "$binary" "$EXPECTED_VERSION" "$VARIANT"
          if [[ "$VARIANT" == full ]]; then
            node dev-tools/release/dist/src/cli/smoke-packaged-web.js "$binary" web/atlas-ui/dist
          fi
      - name: Verify published embedding coverage
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'cli-only' }}
        shell: bash
        env:
          NIGHTLY: ${{ inputs.nightly }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.tag }}
          EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          binary=$(find target/package-smoke -type f -name atlas -print -quit)
          test -n "$binary"
          args=()
          if [[ "$NIGHTLY" == true ]]; then
            args+=(--advisory --source-sha "$(git rev-parse HEAD)" --tag "$PACKAGE_TAG"
              --archive target/distrib/atlas-cli-only-x86_64-unknown-linux-gnu.tar.xz
              --report "$RUNNER_TEMP/embedding-coverage.json")
          elif [[ -z "$SOURCE_REF" && ( "$EVENT" == workflow_dispatch || "$EVENT" == push ) ]]; then
            args+=(--advisory)
          fi
          python3 scripts/release/check-embedding-seeds.py "$binary" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain nightly embedding coverage evidence
        if: ${{ inputs.nightly && matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'cli-only' }}
        uses: actions/upload-artifact@v7
        with:
          name: embedding-coverage-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/embedding-coverage.json
          if-no-files-found: error
      - name: Check packaged binary on Windows
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          $prefix = if ($env:VARIANT -eq "full") { "atlas-cli" } else { "atlas-cli-only" }
          Expand-Archive "target/distrib/$prefix-${{ matrix.target }}.zip" target/package-smoke
          $binary = Get-ChildItem target/package-smoke -Filter atlas.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw "packaged atlas.exe is missing" }
          node dev-tools/release/dist/src/cli/smoke-packaged-cli.js $binary.FullName $env:EXPECTED_VERSION $env:VARIANT
          if ($LASTEXITCODE -ne 0) { throw "packaged CLI smoke test failed" }
          if ($env:VARIANT -eq "full") {
            node dev-tools/release/dist/src/cli/smoke-packaged-web.js $binary.FullName web/atlas-ui/dist
            if ($LASTEXITCODE -ne 0) { throw "packaged web smoke test failed" }
          }
      - uses: actions/setup-python@v7
        if: contains(fromJSON(needs.prepare.outputs.embedding-targets), matrix.target)
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: contains(fromJSON(needs.prepare.outputs.embedding-targets), matrix.target)
        with:
          path: target/embedding-models
          key: embedding-models-v1-${{ hashFiles('crates/atlas-embedding/src/catalog.rs', 'crates/atlas-embedding/src/model_cache.rs') }}
      - name: Qualify the packaged binary against predecessor vectors
        if: contains(fromJSON(needs.prepare.outputs.embedding-targets), matrix.target)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --locked -p atlas-runtime --example migrate-fixture-workspace --example read-fixture-vectors --example check-fixture-inference
          cargo run --locked -p atlas-embedding --example prepare-model-cache -- target/embedding-models
          binary=atlas
          suffix=
          archive_ext=tar.xz
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary=atlas.exe
            suffix=.exe
            archive_ext=zip
          fi
          candidate="$(find target/package-smoke -type f -name "$binary" -print -quit)"
          test -n "$candidate"
          prefix=atlas-cli
          if [[ "${{ matrix.variant }}" == cli-only ]]; then prefix=atlas-cli-only; fi
          archive="target/distrib/$prefix-${{ matrix.target }}.$archive_ext"
          python - "$archive" "$candidate" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib
          import sys
          for path in sys.argv[1:]:
              with open(path, "rb") as stream:
                  print(hashlib.file_digest(stream, "sha256").hexdigest(), path)
          PY
          python scripts/validation/probe-embedding-upgrade.py --pins \
            --repository "$GITHUB_REPOSITORY" --candidate "$candidate" \
            --workspace-migrator "target/debug/examples/migrate-fixture-workspace$suffix" \
            --compact-vector-reader "target/debug/examples/read-fixture-vectors$suffix" \
            --fixture-inference "target/debug/examples/check-fixture-inference$suffix" \
            --model-cache target/embedding-models --output "$RUNNER_TEMP/packaged-embedding"
      - uses: actions/upload-artifact@v7
        if: always() && contains(fromJSON(needs.prepare.outputs.embedding-targets), matrix.target)
        with:
          name: packaged-embedding-${{ matrix.target }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/packaged-embedding/bundle-*/*.json
      - name: Upload cargo-dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}-${{ matrix.variant }}
          path: |
            target/distrib/atlas-cli*-${{ matrix.target }}.*
            target/distrib/cli-only-${{ matrix.target }}.json
          if-no-files-found: error

  assemble:
    name: assemble release assets
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dev-tools/release/package-lock.json
      - name: Build private release tools
        shell: bash
        run: |
          npm --prefix dev-tools/release ci --ignore-scripts
          npm --prefix dev-tools/release run build
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: target/distrib
          merge-multiple: true
      - name: Prepare nightly version
        if: ${{ inputs.nightly }}
        shell: bash
        env:
          NIGHTLY_TAG: ${{ inputs.tag }}
        run: node dev-tools/release/dist/src/cli/nightly.js prepare --tag "$NIGHTLY_TAG"
      - name: Download verified cargo-dist archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.dist-artifacts }}-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/atlas-cargo-dist-archives
      - name: Install cargo-dist
        shell: bash
        env:
          DIST_ARCHIVES: ${{ runner.temp }}/atlas-cargo-dist-archives
          DIST_TARGET: x86_64-unknown-linux-gnu
        run: node scripts/release/cargo-dist.mjs install "$DIST_ARCHIVES" "$DIST_TARGET"
      - name: Add installers and notices
        shell: bash
        run: |
          set -euo pipefail
          node dev-tools/release/dist/src/cli/generate-notices.js --output target/distrib/THIRD-PARTY-NOTICES.md
          cp scripts/install/atlas-installer.sh target/distrib/atlas-installer.sh
          cp scripts/install/atlas-installer.ps1 target/distrib/atlas-installer.ps1
      - name: Generate cargo-dist manifest
        shell: bash
        run: |
          dist manifest --artifacts local --tag "$TAG" --allow-dirty --no-local-paths --output-format json > dist-manifest.json
          node dev-tools/release/dist/src/cli/prune-dist-manifest.js dist-manifest.json target/distrib
          mv dist-manifest.json target/distrib/dist-manifest.json
      - name: Generate manifest and checksums
        shell: bash
        run: node dev-tools/release/dist/src/cli/generate-release-manifest.js "$TAG" target/distrib
      - name: Validate required assets
        shell: bash
        run: node dev-tools/release/dist/src/cli/validate-release-assets.js "$TAG" target/distrib
      - name: Upload assembled release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-build-check-${{ needs.prepare.outputs.tag }}
          path: target/distrib/*
          if-no-files-found: error
