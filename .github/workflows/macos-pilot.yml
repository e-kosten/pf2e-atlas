name: macOS pilot

on:
  pull_request:
    paths:
      - '.github/workflows/macos-pilot.yml'
      - '.cargo/**'
      - 'Cargo.*'
      - 'crates/**'
      - 'desktop/**'
      - 'web/atlas-ui/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Apple Silicon app bundle
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install frontend and bundle tooling
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix desktop ci
      - name: Build the app and test its native host
        run: |
          sh desktop/bundle-macos.sh
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target-dir target
          cargo test --locked -p atlas-cli --test desktop
      - name: Check the bundled command in an empty home
        run: |
          app='target/debug/bundle/macos/PF2e Atlas.app'
          cli="$app/Contents/MacOS/atlas"
          file "$app/Contents/MacOS/atlas-desktop" "$cli" | tee binaries
          test "$(grep -c 'Mach-O 64-bit executable arm64' binaries)" = 2
          cmp target/debug/atlas "$cli"
          home="$(mktemp -d)"
          HOME="$home" "$cli" desktop-probe | jq -e '.data.version == 1 and .data.status == "needs_setup"'
