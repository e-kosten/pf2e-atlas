name: macOS desktop

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Apple Silicon app bundle
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install frontend and bundle tooling
        run: |
          npm --prefix web/atlas-ui ci
          npm --prefix desktop ci
      - name: Build the app
        run: |
          node --test desktop/bootstrap.test.mjs desktop/release-config.test.mjs
          sh desktop/bundle-macos.sh
      - name: Check the adaptive icon and bundled command
        run: |
          app='target/debug/bundle/macos/PF2e Atlas.app'
          sh desktop/verify-macos-icon.sh "$app"
          cli="$app/Contents/MacOS/atlas"
          file "$app/Contents/MacOS/atlas-desktop" "$cli" | tee binaries
          test "$(grep -c 'Mach-O 64-bit executable arm64' binaries)" = 2
          cmp target/debug/atlas "$cli"
          home="$(mktemp -d)"
          HOME="$home" "$cli" desktop-probe | jq -e '.data.version == 1 and .data.status == "needs_setup"'
      # Integration tests can rebuild target/debug/atlas with dev-dependency features.
      - name: Test the native host and CLI desktop commands
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target-dir target
          cargo test --locked -p atlas-cli --test desktop
