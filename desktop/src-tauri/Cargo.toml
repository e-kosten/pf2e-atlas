[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlas-desktop-protocol = { path = "../../crates/atlas-desktop-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
url = "2"
ureq = { version = "3", default-features = false, features = ["json"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
plist = "1"
rustix = { version = "1", features = ["fs", "process"] }
semver = "1"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
