[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlas-desktop-protocol = { path = "../../crates/atlas-desktop-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
url = "2"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSGraphics", "NSMenu", "NSMenuItem", "NSEvent", "NSResponder", "NSWindow", "NSWindowTabGroup"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
