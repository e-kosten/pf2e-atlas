[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlas-desktop-protocol = { path = "../../crates/atlas-desktop-protocol" }
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
url = "2"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json"] }
tauri-plugin-updater = "~2.14.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
rustix = { version = "1", features = ["fs", "process"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSColor", "NSGraphics", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSEvent", "NSResponder", "NSScrollView", "NSControl", "NSSearchField", "NSTextField", "NSTextFinder", "NSView", "NSWindow", "NSWindowTab", "NSWindowTabGroup"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSNotification", "NSOperation", "block2"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
