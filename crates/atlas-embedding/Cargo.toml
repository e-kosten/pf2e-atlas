[package]
name = "atlas-embedding"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
atlas-domain.workspace = true
fastembed.workspace = true
text-splitter.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tracing.workspace = true
ureq.workspace = true
tempfile = "3"

# sha2 0.10 gates ARM hardware dispatch behind asm; its MSVC assembler is unsupported.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
