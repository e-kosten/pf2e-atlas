[package]
name = "atlas-dev"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Local developer diagnostics for Atlas source and artifacts"

[package.metadata.dist]
dist = false

[dependencies]
tracing.workspace = true
atlas-cli-support.workspace = true
atlas-ingest.workspace = true
atlas-index.workspace = true
atlas-search = { workspace = true, features = ["read-metrics"] }
atlas-domain.workspace = true
atlas-foundry-model.workspace = true
sha2.workspace = true
atlas-runtime.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
atlas-storage.workspace = true
time.workspace = true
tempfile = "3"

[dev-dependencies]
atlas-index = { workspace = true, features = ["test-support"] }
atlas-record.workspace = true
atlas-embedding.workspace = true
