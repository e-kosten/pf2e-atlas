tokio.workspace = true

[dev-dependencies]
atlas-index.workspace = true
atlas-runtime.workspace = true
atlas-search = { workspace = true, features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["signal"] }
tower = { version = "0.5.2", features = ["util"] }
