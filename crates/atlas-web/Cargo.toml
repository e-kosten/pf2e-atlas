[package]
name = "atlas-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
atlas-app-model.workspace = true
atlas-app-service.workspace = true
atlas-domain.workspace = true
axum.workspace = true
rust-embed = { workspace = true, features = ["debug-embed"] }
