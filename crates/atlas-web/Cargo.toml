[package]
name = "atlas-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["embedded-ui"]
embedded-ui = ["dep:rust-embed"]

[dependencies]
atlas-app-model = { workspace = true, features = ["openapi"] }
atlas-app-service.workspace = true
atlas-domain.workspace = true
axum.workspace = true
rust-embed = { workspace = true, features = ["debug-embed"], optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
atlas-record.workspace = true
sha2.workspace = true
atlas-index.workspace = true
atlas-runtime.workspace = true
atlas-search = { workspace = true, features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["signal"] }
tower = { version = "0.5.2", features = ["util"] }
