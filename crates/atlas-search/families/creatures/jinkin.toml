name = "Jinkin"
source_note = "Monster Core and the two older Society blocks share Shortsword, Sneak Attack, and Tinker. The Society blocks have AC 17 and 19 HP and differ in the Foundry predicate for their Crafting bonus for traps. Quest 20, The Dacilane Academy's Show Must Go On, prints the level 1 Jinkin and level −1 Lesser Jinkin in the Balcony encounter (p. 16) and adds the Lesser under specific scaling conditions."

