name = "Kobold Scout"
source_note = "The Monster Core scout gains Construct Trap and a circumstance bonus to defenses against traps. The Beginner Box scout lacks those entries. The Legacy Society scouts share Scamper and Sneak Attack. Lions of Katapesh adds lesser Alchemist’s Fire. Flames of Rebellion and Fate in the Future supply the same Foundry combat block without an identified Legacy reference actor."

