name = "Boggard Swampseer"
source_note = "The Monster Core and Lost Legend swampseers share Destructive Croak, Drowning Drone, Terrifying Croak, and Tongue Grab. Encounter A uses the Animal Staff block at party levels 3–4 and 5–6, with two Elite loadouts available through upper-tier scaling (pp. 21, 25–26). The Foundry titles say PFS 1-24 and the pack path and publication identify The Lost Legend (1-20)."
