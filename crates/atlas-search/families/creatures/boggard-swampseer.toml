name = "Boggard Swampseer"
source_note = "The Monster Core and Lost Legend swampseers share Destructive Croak, Drowning Drone, Terrifying Croak, and Tongue Grab. The Lost Legend supplies an ordinary Animal Staff block and two typed Elite actors, one with an Animal Staff and one with a plain Staff. The Foundry titles say PFS 1-24 and the pack path and publication identify The Lost Legend (1-20)."

