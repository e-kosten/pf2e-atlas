[package]
name = "atlas-dice-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = "0.8"
caith = "=4.2.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
dicexp = "=1.3.0"

[profile.dev]
debug = "line-tables-only"
incremental = false
